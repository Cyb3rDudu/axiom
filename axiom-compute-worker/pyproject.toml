[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-compute-worker"
version = "0.1.0"
description = "axiom compute worker (document processing, query embedding, reranking)"
requires-python = ">=3.11"

[project.scripts]
# Canonical entrypoint (ADR 0001 §4, F10 #304); the axiom-runner console
# script stays as the legacy alias — importing the alias package warns
# exactly once and delegates (removal earliest in an announced major).
axiom-compute-worker = "axiom_compute_worker.__main__:main"
axiom-runner = "axiom_ng_runner.__main__:main"

# Standard two-package layout since F10: the canonical
# ``axiom_compute_worker`` package plus the tiny ``axiom_ng_runner``
# compat alias package (warn-once delegation, ADR 0001 §4). Directory
# names match package names — the old flat package-dir remap (#209) is
# gone with the rename.
[tool.setuptools]
packages = [
  "axiom_compute_worker",
  "axiom_compute_worker.compute_core",
  "axiom_compute_worker.compute_core.epub_worker",
  "axiom_compute_worker.compute_core.pdf_worker",
  "axiom_ng_runner",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ruff gate (CI runner-pytest job): the ENFORCED set is pinned so a newer
# ruff's expanded defaults cannot change the gate retroactively — same
# rule as the fixer pyproject (#286 unification).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
