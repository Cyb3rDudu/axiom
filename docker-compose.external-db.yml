# Docker Compose configuration for Axiom with External PostgreSQL
services:
  backend:
    image: axiom-backend
    container_name: axiom-backend
    volumes:
      - axiom-data:/app/ai_researcher/data
      - ./axiom_model_cache:/root/.cache/huggingface
      - ./axiom_datalab_cache:/root/.cache/datalab
      - ./reports:/app/reports
      - ./axiom_backend/data:/app/data
    working_dir: /app
    environment:
      - MAX_WORKER_THREADS=${MAX_WORKER_THREADS:-10}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      - FORCE_CPU_MODE=true
      - PREFERRED_DEVICE_TYPE=cpu
      # Embedding optimization for multi-core CPU
      - EMBEDDING_BATCH_SIZE=256
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - axiom-network
    restart: unless-stopped

  doc-processor:
    image: axiom-doc-processor
    container_name: axiom-doc-processor
    command: ["python", "-u", "services/background_document_processor.py"]
    working_dir: /app
    volumes:
      - axiom-data:/app/ai_researcher/data
      - ./axiom_model_cache:/root/.cache/huggingface
      - ./axiom_datalab_cache:/root/.cache/datalab
      - ./reports:/app/reports
      - ./axiom_backend/data:/app/data
    depends_on:
      - backend
    networks:
      - axiom-network
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      - FORCE_CPU_MODE=true
      - PREFERRED_DEVICE_TYPE=cpu
      # Embedding optimization for multi-core CPU
      - EMBEDDING_BATCH_SIZE=256
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped

  frontend:
    image: axiom-frontend
    container_name: axiom-frontend
    networks:
      - axiom-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: axiom-nginx
    volumes:
      - ./nginx/nginx.conf.complete:/etc/nginx/nginx.conf:ro
    ports:
      - "${AXIOM_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - axiom-network
    restart: unless-stopped

networks:
  axiom-network:
    name: axiom_axiom-network

volumes:
  axiom-data:
    name: axiom_axiom-data
