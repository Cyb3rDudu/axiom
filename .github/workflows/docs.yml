# Build and deploy the axiom-ng documentation site to GitHub Pages.
# Trigger: docs(...) commits (paths) on main. Uses the standard Pages actions.
#
# Repo prerequisites (dudu): GitHub Settings → Pages → Build and deployment →
# Source = "GitHub Actions".

name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Generalizability gate (no private infra in published docs)
        run: |
          if grep -rniE '192\.168\.|mothership|\/Users\/|100\.(6[4-9]|7[0-9]|8[0-9]|9[0-9]|1[0-2][0-7])\.' docs/ | grep -v '_inventory.md'; then
            echo "private infra found in published docs"
            exit 1
          fi

      - name: Naming gate (product name 'axiom', not 'axiom-ng')
        # Product name is 'axiom'. The single allowed occurrence is the historical
        # reference in About (formerly known as axiom-ng during development).
        # docs/_inventory.md is an internal meta file and is exempt.
        run: |
          if grep -ri 'axiom-ng' docs/ --include='*.md' | grep -v '_inventory.md' | grep -v 'about/index.md'; then
            echo "legacy product name 'axiom-ng' found in published pages"
            exit 1
          fi

      - name: Build documentation
        run: mkdocs build --clean --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
