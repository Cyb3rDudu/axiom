# Build and deploy the axiom documentation site to GitHub Pages.
# Trigger: docs(...) commits (paths) on main. Uses the standard Pages actions.
#
# Repo prerequisites (dudu): GitHub Settings → Pages → Build and
# deployment → Source = "GitHub Actions".

name: docs

on:
    push:
        branches:
            - main
        paths:
            - "docs/**"
            - "mkdocs.yml"
            - ".github/workflows/docs.yml"
    pull_request:
        paths:
            - "docs/**"
            - "mkdocs.yml"
            - ".github/workflows/docs.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install MkDocs
              run: pip install -r docs/requirements.txt

            - name: Generalizability gate (no private infra in published docs)
              run: |
                  PRIV_A='192\.168\.|mothership|\/Users\/'
                  PRIV_B='100\.(6[4-9]|7[0-9]|8[0-9]|9[0-9]|1[0-2][0-7])\.'
                  if grep -rniE "$PRIV_A|$PRIV_B" docs/ \
                    | grep -v '_inventory.md'; then
                    echo "private infra found in published docs"
                    exit 1
                  fi

            - name: Naming gate (product name 'axiom', not 'axiom-ng')
              # Product name is 'axiom'. Allowed occurrences (#352 sweep):
              # 1) the single historical note in About ("was known as
              #    *axiom-ng*") — exempted at phrase level, not whole-file;
              # 2) go run/go build command lines referencing the alias
              #    binary (`axiom/cmd/axiom-ng`, `cd axiom && go run
              #    ./cmd/axiom-ng`) — code paths are technical facts;
              # 3) CLI invocations of the binary (`./axiom-ng -flag …`,
              #    `axiom-ng --version`) — the binary's name is a fact;
              # 4) release artifact names (`axiom-ng-<version>…`) and the
              #    alias list (`axiom-ng, axiom-compute-worker,
              #    axiom-repair-worker`) — shipped names are facts;
              # 5) mapping-table rows: ADR 0001 (the binding decision
              #    names what it maps) plus the operator pages whose
              #    old-name columns quote legacy identifiers verbatim
              #    (migration guide, deprecations: state dir, index,
              #    module, binary). Scoped to TABLE ROWS: the exemptions
              #    anchor to the grep file prefix AND a leading `|`, so
              #    legacy literals in prose stay red. Banner, index and
              #    state-dir defaults are canonical since #352 and need
              #    no string-level exemptions anymore.
              # Both source greps run with -H so output lines ALWAYS
              # carry the filename prefix — the anchor stage can then
              # only ever match lines that genuinely originate from the
              # docs/ scan (a crafted mkdocs.yml line cannot spoof it).
              # mkdocs.yml is checked as well (site_name regression);
              # docs/_inventory.md is internal meta and exempt.
              run: |
                  ADRROWS='^docs/adr/0001[^:]*\.md:\|'
                  MIG='^docs/operations/migration-g[^:]*\.md:\|'
                  OPSROWS='^docs/operations/deprecations\.md:\|'
                  if { grep -riH 'axiom-ng' docs/ --include='*.md'
                       grep -iH 'axiom-ng' mkdocs.yml; } \
                    | grep -v '_inventory.md' \
                    | grep -vF 'was known as *axiom-ng*' \
                    | grep -vE '(go run|go build).*cmd/axiom-ng' \
                    | grep -vE '(\./)?axiom-ng +-' \
                    | grep -vF 'axiom-ng-<version>' \
                    | grep -vF 'axiom-ng, axiom-compute-worker' \
                    | grep -vE "$ADRROWS" \
                    | grep -vE "$MIG" \
                    | grep -vE "$OPSROWS"; then
                    echo "legacy product name 'axiom-ng' found in site content"
                    exit 1
                  fi

            - name: Build documentation
              run: mkdocs build --clean --strict

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

    deploy:
        if: github.event_name != 'pull_request'
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
