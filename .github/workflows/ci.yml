name: ci

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: axiom_ng

jobs:
  # --- #295: frozen v0.1.18 compatibility baseline -----------------------
  # The environment-independent half of the golden gate: router-derived
  # API inventory (red on any route surface change), comparator mutation
  # probes, and the schema fingerprint — regenerated from a FRESH
  # db.Migrate of the current migration files on a pgvector service pinned
  # to the freeze extension version (0.8.6 is part of the fingerprint). A
  # red job means the PR changed the frozen surface/schema and must
  # deliberately update internal/baseline/fixtures in the same PR.
  # The live half (health/search/ingest/repair against the release bits)
  # runs on the dev host via `make golden-baseline`.
  golden-baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: axiom_user
          POSTGRES_PASSWORD: axiom_password
          POSTGRES_DB: axiom_ng_ci_baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AXIOM_BASELINE_DSN:
        "postgresql://axiom_user:axiom_password@localhost:5432/axiom_ng_ci_baseline?sslmode=\
        disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: axiom_ng/go.mod
      - name: baseline suite (inventory + fingerprint + probes)
        working-directory: axiom_ng
        run: go test ./internal/baseline -count=1 -v

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: axiom_ng/go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: dev scripts lint
        working-directory: .
        run: |
          bash -n scripts/dev/*.sh
          shellcheck --severity=warning scripts/dev/*.sh
          # env.sh and dev-up.sh must define the same dev identity — drift would
          # point manual tool runs at a stale (or prod) namespace
          a="$(grep -hE '^DEV_(INDEX|DB)=' scripts/dev/env.sh | sort)"
          b="$(grep -hE '^DEV_(INDEX|DB)=' scripts/dev/dev-up.sh | sort)"
          test "$a" = "$b"

  go-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: axiom_ng/go.mod
      # No AXIOM_TEST_DATABASE_URL: the DB-gated integration tests skip by
      # design; everything else must pass.
      - name: unit suites (DB tests skip)
        run: go test -count=1 ./...

  # --- F12 #306: Library repository contract suite, engine matrix ------
  # The SAME suite (internal/library/reposuite) against BOTH Library
  # engines — two separate jobs because the legs need different
  # environments (a matrix leg cannot drop the shared services block):
  #
  #   - library-engine-postgres: pgvector service + AXIOM_TEST_DATABASE_URL;
  #     runs the reposuite runner (both suite legs, availability-gated —
  #     the runner's skip guard turns any engine-specific skip INSIDE the
  #     suite red), the SQLite engine's contract-suite leg (as a control),
  #     the pglib suite leg, and the skip-guard teeth. The legs carry the
  #     CONTRACT suites only: the SQLite engine's OPERATING tests
  #     (pragmas, permissions, lease probes, busy-timeout) are DB-free
  #     and run in go-unit on every push; the PG engine's operating tests
  #     are DSN-gated and ride go-db-it instead.
  #   - library-engine-sqlite: NO service, NO DSN — the SQLite engine's
  #     contract-suite leg must pass in a PostgreSQL-free environment
  #     (that is the point of this leg; a skip here is the guard's
  #     business, never silently green).
  #
  # A red leg means an engine lost parity.
  library-engine-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom_user
          POSTGRES_PASSWORD: axiom_password
          POSTGRES_DB: axiom_ng_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AXIOM_TEST_DATABASE_URL:
        "postgresql://axiom_user:axiom_password@localhost:5432/axiom_ng_ci_test?sslmode=\
        disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: axiom_ng/go.mod
      - name: "library repository contract suite (engine: postgres + sqlite)"
        run: go test -count=1 -v ./internal/library/reposuite ./internal/library/sqlite ./internal/library/pglib -run 'TestRepositoryContractSuite|TestSkipGuardProbes'

  library-engine-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: axiom_ng/go.mod
      # No postgres service and no DSN: the SQLite engine and its shared
      # contract-suite leg must run green with no PostgreSQL anywhere in
      # the environment.
      - name: "library repository contract suite (engine: sqlite, PG-free)"
        run: go test -count=1 -v ./internal/library/reposuite ./internal/library/sqlite -run 'TestRepositoryContractSuite|TestSkipGuardProbes'

  go-db-it:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom_user
          POSTGRES_PASSWORD: axiom_password
          POSTGRES_DB: axiom_ng_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AXIOM_TEST_DATABASE_URL:
        "postgresql://axiom_user:axiom_password@localhost:5432/axiom_ng_ci_test?sslmode=\
        disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: axiom_ng/go.mod
      # Schema/fingerprint gates (frozen + allowlist-derivation) run in the
      # golden-baseline job below via AXIOM_BASELINE_DSN; this job's env
      # intentionally carries only the IT DSN.
      # No manual schema application: db.Migrate() owns the schema (tracks
      # applied files itself — pre-applying via psql desyncs its ledger and
      # 42710s on CREATE TYPE). The IT harnesses call Migrate on fresh DBs.
      - name: full suites incl. DB ITs
        run: go test -p 1 -count=1 ./...

  runner-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axiom-compute-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements.txt is the light/reference stack (fastapi, pydantic,
      # pymupdf, pytest) — heavy GPU deps are NOT needed by the test suite
      # (no test module imports them at collection time; live-GPU ITs skip).
      - name: install
        run: pip install -r requirements.txt
      # #274: pandoc for the EPUB-worker E2E + parity-gate tests (the
      # epub_worker shells out to the pandoc binary; without it those
      # tests skip and the DoD gate never runs in CI).
      - name: install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      # Scope: tests/ is the enforced surface (the step below). The
      # heavy-compute modules carry pre-existing findings outside the
      # enforced set — not this branch's business.
      - name: ruff
        run: ruff check tests/
      - name: pytest
        run: python -m pytest tests/

  fixer-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axiom_ng/tools/pdf_repair_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CI symmetry (#286 review): the runner suite has a job, the fixer
      # suite did not — same shape both sides. requirements.txt is the
      # light stack (pymupdf, pytest); the OCR-binaries tests skip without
      # tesseract/ocrmypdf (needs_ocr marker), the artifact build runs the
      # full gated verification including the sanitized-PATH smoke.
      - name: install
        run: pip install -r requirements.txt
      # ruff is NOT a fixer runtime dep (it would ship in the artifact) —
      # the runner job gets it via its requirements.txt; here it is an
      # explicit tool install for the gate (review Runde 3: the job ran
      # red with 'ruff: command not found' since introduction). BOTH jobs
      # float latest ruff by design (the runner's requirements entry is
      # unpinned too); the pinned [tool.ruff.lint] select sets are the
      # actual gate.
      - name: install ruff
        run: pip install ruff
      # Scope mirrors the runner job's enforced set (tests/).
      - name: ruff
        run: ruff check tests/
      - name: pytest
        run: python -m pytest tests/
