# Release pipeline (#205 §4): tag -> make all -> artifacts -> GitHub Release.
# darwin arm64 only — the Carrier runner path stays containerized (non-goal
# per #205), so no linux artifacts are produced here.
name: release
on:
  push:
    tags: ["v*"]
# (no workflow_dispatch: GITHUB_REF_NAME would be a branch on manual runs
#  and gh release --verify-tag would fail)

permissions:
  contents: write

jobs:
  darwin-arm64:
    runs-on: macos-14 # arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: axiom_ng/go.mod
      - uses: actions/setup-python@v5
        with:
          # fixer requirements.lock.txt is a python 3.11 freeze — newer
          # system pythons (3.14 on hosted runners) hit wheel gaps (pi_heif)
          python-version: "3.11"
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: Build rag (release, version-stamped)
        run: make rag
      - name: Build runner + fixer artifacts
        run: |
          brew install zstd
          make runner fixer
      - name: Checksums
        run: |
          ls -lh dist/
          for f in dist/*.sha256; do shasum -a 256 -c "$f"; done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes --verify-tag)
          assets=(dist/axiom-ng-* dist/*.tar.zst dist/*.sha256)
          gh release create "$GITHUB_REF_NAME" "${args[@]}" "${assets[@]}" || \
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
