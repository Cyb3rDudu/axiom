[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
# Der Service ist ein autarker Kasten mit EIGENEM Venv (bootstrap.sh).
# Pyright löst das Paket + seine gepinnten Reqs gegen dieses Venv auf —
# NIEMALS gegen das System-Python (3.9) oder Projekt-Venvs.
pythonVersion = "3.11"
pythonPlatform = "Darwin"
venvPath = "."
venv = ".venv"

# ruff gate (CI fixer-pytest job mirrors the runner job's shape; #286):
# pin the ENFORCED set explicitly so a newer ruff's expanded defaults
# cannot change the gate retroactively. The E402 noqas in tests/ cover the
# sys.path-insert harness pattern and are correct under this set.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
