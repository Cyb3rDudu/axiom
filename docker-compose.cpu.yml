services:
  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg15
    container_name: axiom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axiom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axiom_password}
      POSTGRES_DB: ${POSTGRES_DB:-axiom_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - axiom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axiom_user} -d ${POSTGRES_DB:-axiom_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy - single entry point for the application
  nginx:
    image: axiom-nginx
    container_name: axiom-nginx
    ports:
      - "${AXIOM_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - axiom-network
    restart: unless-stopped

  backend:
    image: axiom-backend
    container_name: axiom-backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - axiom-data:/app/ai_researcher/data
      - ./axiom_model_cache:/root/.cache/huggingface
      - ./axiom_datalab_cache:/root/.cache/datalab
      - ./reports:/app/reports
      - ./axiom_backend/data:/app/data
    working_dir: /app
    environment:
      - MAX_WORKER_THREADS=${MAX_WORKER_THREADS:-10}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      # Force CPU mode
      - FORCE_CPU_MODE=true
      - PREFERRED_DEVICE_TYPE=cpu
      # Embedding optimization for multi-core CPU
      - EMBEDDING_BATCH_SIZE=256
      # CORS configuration for reverse proxy support
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      # Allow all origins in development mode when using nginx proxy
      - ALLOW_CORS_WILDCARD=${ALLOW_CORS_WILDCARD:-true}
      # PostgreSQL connection
      - DATABASE_URL=postgresql://${POSTGRES_USER:-axiom_user}:${POSTGRES_PASSWORD:-axiom_password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-axiom_db}
      # Admin credentials for initial setup
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      # JWT Secret for authentication
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-this}
    networks:
      - axiom-network
    # No GPU configuration for CPU-only mode

  frontend:
    image: axiom-frontend
    container_name: axiom-frontend
    depends_on:
      - backend
    networks:
      - axiom-network
    environment:
      # API URLs (optional - using relative URLs through nginx proxy by default)
      - VITE_SERVER_TIMEZONE=${VITE_SERVER_TIMEZONE:-UTC}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}

  doc-processor:
    image: axiom-doc-processor
    container_name: axiom-doc-processor
    command: ["python", "-u", "services/background_document_processor.py"]
    working_dir: /app
    volumes:
      - axiom-data:/app/ai_researcher/data
      - ./axiom_model_cache:/root/.cache/huggingface
      - ./axiom_datalab_cache:/root/.cache/datalab
      - ./reports:/app/reports
      - ./axiom_backend/data:/app/data
    depends_on:
      - backend
    networks:
      - axiom-network
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      # PostgreSQL connection - same as backend
      - DATABASE_URL=postgresql://${POSTGRES_USER:-axiom_user}:${POSTGRES_PASSWORD:-axiom_password}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-axiom_db}
      # Force CPU mode
      - FORCE_CPU_MODE=true
      - PREFERRED_DEVICE_TYPE=cpu
      # Embedding optimization for multi-core CPU
      - EMBEDDING_BATCH_SIZE=256
    # No GPU configuration for CPU-only mode

  cli:
    image: axiom-cli
    container_name: axiom-cli
    command: ["bash"]
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - axiom-data:/app/ai_researcher/data
      - ./axiom_model_cache:/root/.cache/huggingface
      - ./axiom_datalab_cache:/root/.cache/datalab
      - ./reports:/app/reports
      - ./axiom_backend/data:/app/data
    depends_on:
      - backend
    networks:
      - axiom-network
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      # Force CPU mode
      - FORCE_CPU_MODE=true
      - PREFERRED_DEVICE_TYPE=cpu
    # No GPU configuration for CPU-only mode

  # Optional local LLM service (uncomment if using)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: axiom-ollama
  #   ports:
  #     - "${LOCAL_LLM_HOST:-127.0.0.1}:${LOCAL_LLM_PORT:-5000}:${LOCAL_LLM_INTERNAL_PORT:-11434}"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - axiom-network
  #   restart: unless-stopped

volumes:
  postgres-data:
  axiom-data:
  # Uncomment if using local LLM
  # ollama-data:

networks:
  axiom-network:
    driver: bridge