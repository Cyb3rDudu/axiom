# Docker Compose configuration for Axiom with External PostgreSQL and GPU support
# Using explicitly built local images
services:
  backend:
    image: axiom-backend:local
    container_name: axiom-backend
    volumes:
      - ~/AI-Models/huggingface:/root/.cache/huggingface
      - ~/AI-Models/spacy:/root/.local/share/spacy
      - ./axiom_datalab_cache:/root/.cache/datalab
      - ./reports:/app/reports
      - ./axiom_backend/data:/app/data
    working_dir: /app
    environment:
      - MAX_WORKER_THREADS=${MAX_WORKER_THREADS:-20}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FORCE_CPU_MODE=${FORCE_CPU_MODE:-false}
      - PREFERRED_DEVICE_TYPE=${PREFERRED_DEVICE_TYPE:-cuda}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-512}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MARKER_USE_LLM=${MARKER_USE_LLM:-False}
      - MARKER_LLM_SERVICE=${MARKER_LLM_SERVICE:-marker.services.openai.OpenAIService}
      - MARKER_LLM_MODEL=${MARKER_LLM_MODEL:-gpt-5.2}
      - MARKER_LLM_API_KEY=${MARKER_LLM_API_KEY:-${OPENAI_API_KEY}}
      - MARKER_LLM_BASE_URL=${MARKER_LLM_BASE_URL:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - ALLOW_CORS_WILDCARD=${ALLOW_CORS_WILDCARD:-true}
      - HF_HUB_OFFLINE=1
      - CUDA_MODULE_LOADING=LAZY
      - SPACY_DATA=/root/.local/share/spacy
      - ENABLE_KNOWLEDGE_GRAPH=${ENABLE_KNOWLEDGE_GRAPH:-true}
      - ENABLE_GRAPH_RETRIEVAL=${ENABLE_GRAPH_RETRIEVAL:-false}
    networks:
      - axiom-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BACKEND_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    restart: unless-stopped

  doc-processor:
    image: axiom-backend:local
    container_name: axiom-doc-processor
    command: ["python", "-u", "services/background_document_processor.py"]
    working_dir: /app
    volumes:
      - ~/AI-Models/huggingface:/root/.cache/huggingface
      - ~/AI-Models/spacy:/root/.local/share/spacy
      - ./axiom_datalab_cache:/root/.cache/datalab
      - ./reports:/app/reports
      - ./axiom_backend/data:/app/data
    depends_on:
      - backend
    networks:
      - axiom-network
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FORCE_CPU_MODE=${FORCE_CPU_MODE:-false}
      - PREFERRED_DEVICE_TYPE=${PREFERRED_DEVICE_TYPE:-cuda}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-512}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MARKER_USE_LLM=${MARKER_USE_LLM:-False}
      - MARKER_LLM_SERVICE=${MARKER_LLM_SERVICE:-marker.services.openai.OpenAIService}
      - MARKER_LLM_MODEL=${MARKER_LLM_MODEL:-gpt-5.2}
      - MARKER_LLM_API_KEY=${MARKER_LLM_API_KEY:-${OPENAI_API_KEY}}
      - MARKER_LLM_BASE_URL=${MARKER_LLM_BASE_URL:-}
      - HF_HUB_OFFLINE=1
      - CUDA_MODULE_LOADING=LAZY
      - SPACY_DATA=/root/.local/share/spacy
      - ENABLE_KNOWLEDGE_GRAPH=${ENABLE_KNOWLEDGE_GRAPH:-true}
      - ENABLE_GRAPH_RETRIEVAL=${ENABLE_GRAPH_RETRIEVAL:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DOC_PROCESSOR_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    image: axiom-frontend:local
    container_name: axiom-frontend
    networks:
      - axiom-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: axiom-nginx
    volumes:
      - ./nginx/nginx.conf.complete:/etc/nginx/nginx.conf:ro
    ports:
      - "${AXIOM_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - axiom-network
    restart: unless-stopped

networks:
  axiom-network:
    name: axiom_axiom-network

volumes:
  axiom-data:
    name: axiom_axiom-data
